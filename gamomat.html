<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/casino-content/gamomat.css">
</head>
<body>
    <header class="studio" data-parallax-section data-parallax-trigger>
        <div class="studio__bg studio__bg--gamomat" data-parallax-speed="-5"></div>
        <img src="assets/img/gamomat/gamomat.png" alt="" class="studio__logo" data-parallax-speed="4">
        <div class="studio__cards">
            <img class="studio__garnish" src="assets/img/gamomat/gamomat-garnish.png" alt="" srcset="" data-parallax-speed="1">
            <div class="studio__card studio__card--1">
                <img src="assets/img/gamomat/thumb-1.png" alt="" srcset="">
            </div>
            <div class="studio__card studio__card--2">
                <img src="assets/img/gamomat/thumb-2.png" alt="" srcset="">
            </div>
            <div class="studio__card studio__card--3">
                <img src="assets/img/gamomat/thumb-3.png" alt="" srcset="">
            </div>
            <div class="studio__character studio__character--left" data-parallax-speed="-1">
                <img src="assets/img/gamomat/gamomat-man.png" alt="" srcset="">
            </div>
            <div class="studio__character studio__character--right" data-parallax-speed="-1">
                <img src="assets/img/gamomat/gamomat-dog.png" alt="" srcset="">
            </div>
        </div>

        <div class="studio__content">
            <h1 class="studio__title">Gamomat</h1>
            <p class="studio__text">Germany-based online game developer and successful land-based operator, GAMOMAT creates innovative iGaming products driven by a passionate team of 80+ gaming enthusiasts.</p>
        </div>

    </header>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="js/gsap-setup.js"></script>
    <script src="js/parallax.js"></script>
</body>
</html>
