<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<style>
  .effect-switcher {
    display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10;
  }
  .effect-switcher button {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
    padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px;
    background: #fff; color: #000; cursor: pointer; transition: all 0.2s;
  }
  .effect-switcher button:hover { background: rgba(255,255,255,0.8); }
  .effect-switcher button.active { background: var(--accent, #6c5ce7); border-color: var(--accent, #6c5ce7); color: #fff; }
  #scramble { display: inline-block; position: relative; min-width: 3ch; }
  #scramble .char { display: inline-block; }
</style>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div class="hero">
        <h1>
        <span style="color: var(--accent);"><span id="scramble">engineering</span><br>the experiences</span><br>players demand
    </h1>
    </div>

    <div class="effect-switcher">
      <button class="active" data-effect="scramble">Scramble</button>
      <button data-effect="typewriter">Typewriter</button>
      <button data-effect="slideUp">Slide Up</button>
      <button data-effect="fade">Fade</button>
      <button data-effect="flip">Flip</button>
      <button data-effect="glitch">Glitch</button>
    </div>

    <!-- GSAP Core + Plugins -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

<script src="js/gsap-setup.js"></script>
<script src="js/nav.js"></script>
<script src="js/animations.js"></script>
<script src="js/interactions.js"></script>

<script>
(function () {
  const el = document.getElementById("scramble");
  const words = ["engineering", "creating", "forging", "crafting"];
  const chars = "abcdefghijklmnopqrstuvwxyz";
  const holdDuration = 2;
  let current = 0;
  let activeEffect = "scramble";
  let timer = null;

  /* ── Helpers ── */
  function wrapChars(word) {
    el.innerHTML = word.split("").map(c => `<span class="char">${c}</span>`).join("");
    return el.querySelectorAll(".char");
  }

  function cancelPending() {
    if (timer) { gsap.killTweensOf({}); timer.kill ? timer.kill() : gsap.killDelayedCallsTo(cycle); timer = null; }
    gsap.killTweensOf(el);
    gsap.killTweensOf(".char");
    el.getAnimations?.().forEach(a => a.cancel());
  }

  /* ── Effects ── */
  const effects = {

    /* 1 — Scramble: random chars resolve left-to-right */
    scramble(word, done) {
      const len = word.length;
      const stepsPerChar = 4;
      const totalSteps = len * stepsPerChar;
      gsap.to({ step: 0 }, {
        step: totalSteps, duration: 0.8, ease: "none", roundProps: "step",
        onUpdate() {
          const locked = Math.floor(this.targets()[0].step / stepsPerChar);
          let d = "";
          for (let i = 0; i < len; i++) d += i < locked ? word[i] : chars[Math.floor(Math.random() * chars.length)];
          el.textContent = d;
        },
        onComplete() { el.textContent = word; done(); }
      });
    },

    /* 2 — Typewriter: erase then type */
    typewriter(word, done) {
      const prev = el.textContent;
      const tl = gsap.timeline({ onComplete: done });
      // erase
      tl.to({ i: prev.length }, {
        i: 0, duration: prev.length * 0.04, ease: "none", roundProps: "i",
        onUpdate() { el.textContent = prev.slice(0, Math.round(this.targets()[0].i)); }
      });
      // type
      tl.to({ i: 0 }, {
        i: word.length, duration: word.length * 0.06, ease: "none", roundProps: "i",
        onUpdate() { el.textContent = word.slice(0, Math.round(this.targets()[0].i)); }
      }, "+=0.15");
    },

    /* 3 — Slide Up: old slides out up, new slides in from below */
    slideUp(word, done) {
      const tl = gsap.timeline({ onComplete: done });
      tl.to(el, { y: -40, opacity: 0, duration: 0.35, ease: "power2.in" });
      tl.call(() => { el.textContent = word; gsap.set(el, { y: 40 }); });
      tl.to(el, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" });
    },

    /* 4 — Fade: crossfade */
    fade(word, done) {
      const tl = gsap.timeline({ onComplete: done });
      tl.to(el, { opacity: 0, duration: 0.35, ease: "power1.in" });
      tl.call(() => { el.textContent = word; });
      tl.to(el, { opacity: 1, duration: 0.35, ease: "power1.out" });
    },

    /* 5 — Flip: 3D vertical flip per character */
    flip(word, done) {
      const prevChars = wrapChars(el.textContent);
      const tl = gsap.timeline({ onComplete: done });
      tl.to(prevChars, {
        rotateX: -90, opacity: 0, duration: 0.3, ease: "power2.in",
        stagger: 0.03
      });
      tl.call(() => {
        const newChars = wrapChars(word);
        gsap.set(newChars, { rotateX: 90, opacity: 0 });
        tl.to(newChars, {
          rotateX: 0, opacity: 1, duration: 0.3, ease: "power2.out",
          stagger: 0.03
        });
      });
    },

    /* 6 — Glitch: rapid random text bursts then resolve */
    glitch(word, done) {
      const burstCount = 6;
      let burst = 0;
      const tl = gsap.timeline({ onComplete() { el.textContent = word; done(); } });
      for (let b = 0; b < burstCount; b++) {
        tl.call(() => {
          let g = "";
          for (let i = 0; i < word.length; i++) {
            g += Math.random() < 0.4 ? word[i] : chars[Math.floor(Math.random() * chars.length)];
          }
          el.textContent = g;
          el.style.transform = `translate(${(Math.random() - 0.5) * 4}px, ${(Math.random() - 0.5) * 4}px)`;
        });
        tl.to({}, { duration: 0.06 });
      }
      tl.call(() => { el.style.transform = ""; });
    }
  };

  /* ── Cycle ── */
  function cycle() {
    // Hold current word for holdDuration, then animate to next
    timer = gsap.delayedCall(holdDuration, () => {
      const word = words[current];
      current = (current + 1) % words.length;
      effects[activeEffect](word, cycle);
    });
  }

  /* ── Switcher buttons ── */
  document.querySelectorAll(".effect-switcher button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelector(".effect-switcher .active")?.classList.remove("active");
      btn.classList.add("active");
      cancelPending();
      activeEffect = btn.dataset.effect;
      gsap.set(el, { clearProps: "all" });
      el.textContent = words[(current + words.length - 1) % words.length] || words[0];
      cycle();
    });
  });

  // Start: show first word immediately, then begin cycling
  current = 1;
  cycle();
})();
</script>
    
</body>
</html>
