<!--
  Script loading order (important):
  1. GSAP — synchronous, runs during parse, makes gsap global available
  2. components/index.js — module (deferred), defines + upgrades all custom elements
  3. main.js — defer, runs after components have rendered light DOM
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script type="module" src="components/index.js"></script>
<script src="../js/gsap-setup.js" defer></script>
<script src="../js/nav.js" defer></script>
<script src="../js/animations.js" defer></script>
<script src="../js/interactions.js" defer></script>

</body>
